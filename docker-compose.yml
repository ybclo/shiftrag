# ShiftRAG — One-command enterprise ingestion pipeline
# Usage: docker compose up --build
# Frontend → http://localhost:3000
# Backend  → http://localhost:8000/docs

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shiftrag-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - QDRANT_MODE=memory           # memory | local | remote
      - QDRANT_COLLECTION=shiftrag_docs
      - EMBED_MODEL=BAAI/bge-small-en-v1.5
    volumes:
      - ./backend/app:/app/app  # hot-reload in dev; remove in prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shiftrag-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

